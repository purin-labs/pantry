[package]
name = "bakery-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nalgebra = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[build-dependencies]
bindgen = "0.73"
sha2 = "0.10"

# One optimization unit for the engine and its crates: the browser build
# links it with MuJoCo under LTO (scripts/bakery-robots/build-browser.mjs).
[profile.release]
lto = "fat"
