<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maruzen oven loading rehearsal</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body data-rehearsal="maruzen-rehearsal">
    <main>
      <div class="viewport" id="viewport" aria-busy="true">
        <div class="loading" id="loading" role="status">
          Preparing the oven…
        </div>
        <span class="figure-number" aria-hidden="true">01</span>
        <span class="model-caption">Maruzen / MBCO-5E</span>
      </div>
      <div class="controls">
        <button class="run" id="run" disabled>
          <span>Run rehearsal</span>
        </button>
        <div class="sequence" aria-label="Rehearsal stages">
          <button data-stage="0" aria-pressed="true" disabled>Inspect</button>
          <button data-stage="1" aria-pressed="false" disabled>Place</button>
          <button data-stage="2" aria-pressed="false" disabled>Review</button>
        </div>
      </div>
      <div class="explanation" aria-live="polite">
        <strong id="stage-title">See the work ahead.</strong>
        <p id="stage-description">
          Open the door and review the approach before the tray moves.
        </p>
      </div>
    </main>
    <script type="module" src="scene.js"></script>
  </body>
</html>
