[workspace]
resolver = "3"
exclude = ["crates/bakery-native"]
members = [
    "crates/custom-connector-fetch",
    "crates/message-link-fetch",
    "crates/workspace-executor",
    "crates/media-inspect",
    "crates/shop-gateway",
    "crates/cobot-protocol",
]
[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
